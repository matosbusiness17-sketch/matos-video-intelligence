[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matos-video-intelligence"
version = "0.1.0"
description = "Local-first AI video analysis and automatic Shorts editing toolkit for Matos Systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "yt-dlp>=2024.1.0",
    "opencv-python-headless>=4.8.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "av<14",
]

[project.scripts]
matos-video = "matos_video.cli:main"

[tool.setuptools.packages.find]
include = ["matos_video*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
